!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyCut Web - 100% 브라우저 GPU 숏폼 렌더러</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
  <div class="max-w-xl mx-auto bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700">
    <h1 class="text-2xl font-bold mb-4 text-center text-blue-400">⚡ EasyCut 로컬 브라우저 렌더러</h1>
    <p class="text-xs text-gray-400 mb-6 text-center">서버로 영상이 전송되지 않으며, 접속자의 기기(GPU/CPU) 성능으로 100% 렌더링됩니다.</p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">1. 원본 동영상 선택</label>
        <input type="file" id="videoInput" accept="video/*" class="w-full text-sm bg-gray-700 p-2 rounded border border-gray-600">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">2. 오버레이 자막 입력</label>
        <input type="text" id="subText" value="이 영상은 방문자 PC 성능으로 렌더링됩니다" class="w-full bg-gray-700 p-2 rounded text-white border border-gray-600">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">시작 시간 (초)</label>
          <input type="number" id="startTime" value="0" min="0" class="w-full bg-gray-700 p-2 rounded">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">종료 시간 (초)</label>
          <input type="number" id="endTime" value="15" min="1" class="w-full bg-gray-700 p-2 rounded">
        </div>
      </div>

      <button id="renderBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition">
        내 PC 하드웨어 가속으로 숏폼 렌더링 시작
      </button>

      <div id="progressBox" class="hidden space-y-2">
        <div class="w-full bg-gray-700 rounded-full h-3">
          <div id="progressBar" class="bg-blue-500 h-3 rounded-full" style="width: 0%"></div>
        </div>
        <p id="statusText" class="text-center text-xs text-gray-300">렌더링 준비 중...</p>
      </div>

      <div id="resultBox" class="hidden text-center pt-4">
        <video id="preview" controls class="mx-auto rounded-lg max-h-72 mb-4 border border-gray-600"></video>
        <a id="downloadBtn" class="bg-green-600 hover:bg-green-500 py-2 px-6 rounded-lg font-bold inline-block">완료 영상 다운로드</a>
      </div>
    </div>
  </div>

  <canvas id="renderCanvas" width="1080" height="1920" class="hidden"></canvas>

  <script>
    const videoInput = document.getElementById('videoInput');
    const renderBtn = document.getElementById('renderBtn');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const progressBox = document.getElementById('progressBox');
    const resultBox = document.getElementById('resultBox');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');

    renderBtn.onclick = async () => {
      if (!videoInput.files[0]) return alert('영상을 선택해주세요.');
      
      const file = videoInput.files[0];
      const video = document.createElement('video');
      video.src = URL.createObjectURL(file);
      video.muted = true;
      await video.play();

      const start = parseFloat(document.getElementById('startTime').value);
      const end = parseFloat(document.getElementById('endTime').value);
      const text = document.getElementById('subText').value;

      progressBox.classList.remove('hidden');
      resultBox.classList.add('hidden');
      video.currentTime = start;

      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        preview.src = url;
        downloadBtn.href = url;
        downloadBtn.download = 'easycut_shorts.webm';
        progressBox.classList.add('hidden');
        resultBox.classList.remove('hidden');
        video.pause();
      };

      recorder.start();

      function drawFrame() {
        if (video.currentTime >= end || video.paused) {
          recorder.stop();
          return;
        }

        // 9:16 비율 크롭 및 캔버스 그리기 (방문자 GPU 가속 연산)
        const scale = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
        const nw = video.videoWidth * scale;
        const nh = video.videoHeight * scale;
        const nx = (canvas.width - nw) / 2;
        const ny = (canvas.height - nh) / 2;

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, nx, ny, nw, nh);

        // 자막 오버레이 렌더링
        ctx.font = "bold 58px sans-serif";
        ctx.fillStyle = "#FFD700";
        ctx.textAlign = "center";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 10;
        ctx.strokeText(text, canvas.width / 2, canvas.height * 0.82);
        ctx.fillText(text, canvas.width / 2, canvas.height * 0.82);

        const currentProg = ((video.currentTime - start) / (end - start)) * 100;
        progressBar.style.width = `${Math.min(100, Math.max(0, currentProg))}%`;
        statusText.innerText = `로컬 렌더링 진행 중: ${Math.round(currentProg)}%`;

        requestAnimationFrame(drawFrame);
      }

      video.onseeked = () => {
        drawFrame();
      };
    };
  </script>
</body>
</html>
